apiVersion: v1
kind: Namespace
metadata:
  name: fedcare

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-server
  namespace: fedcare
  labels:
    app: main-server
    tier: aggregation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-server
  template:
    metadata:
      labels:
        app: main-server
        tier: aggregation
    spec:
      containers:
      - name: main-server
        image: fedcare-main-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: MAIN_SERVER_HOST
          value: "0.0.0.0"
        - name: MAIN_SERVER_PORT
          value: "5000"
        - name: NUM_ROUNDS
          value: "5"
        - name: NUM_HOSPITALS
          value: "2"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: main-server
  namespace: fedcare
  labels:
    app: main-server
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: main-server

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-server-1
  namespace: fedcare
  labels:
    app: hospital-server-1
    tier: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospital-server-1
  template:
    metadata:
      labels:
        app: hospital-server-1
        tier: edge
    spec:
      containers:
      - name: hospital-server
        image: fedcare-hospital-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
          name: http
        env:
        - name: HOSPITAL_PORT
          value: "5001"
        - name: MAIN_SERVER_HOST
          value: "main-server"
        - name: MAIN_SERVER_PORT
          value: "5000"
        - name: MAIN_SERVER_URL
          value: "http://main-server:5000"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 20
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: hospital-server-1
  namespace: fedcare
  labels:
    app: hospital-server-1
spec:
  type: ClusterIP
  ports:
  - port: 5001
    targetPort: 5001
    protocol: TCP
    name: http
  selector:
    app: hospital-server-1

