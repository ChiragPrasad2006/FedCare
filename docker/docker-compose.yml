version: '3.8'

services:
  main-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.main_server
    container_name: fedcare-main-server
    ports:
      - "5000:5000"
    environment:
      - MAIN_SERVER_HOST=0.0.0.0
      - MAIN_SERVER_PORT=5000
      - NUM_ROUNDS=10
      - NUM_HOSPITALS=3
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./main_server:/app/main_server
      - ./shared:/app/shared
    networks:
      - fedcare-network
    restart: unless-stopped

  hospital-server-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.hospital_server
    container_name: fedcare-hospital-1
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - HOSPITAL_ID=hospital_1
      - MAIN_SERVER_HOST=main-server
      - MAIN_SERVER_PORT=5000
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./hospital_server:/app/hospital_server
      - ./shared:/app/shared
    networks:
      - fedcare-network
    depends_on:
      - main-server
    restart: unless-stopped

  hospital-server-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.hospital_server
    container_name: fedcare-hospital-2
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - HOSPITAL_ID=hospital_2
      - MAIN_SERVER_HOST=main-server
      - MAIN_SERVER_PORT=5000
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./hospital_server:/app/hospital_server
      - ./shared:/app/shared
    networks:
      - fedcare-network
    depends_on:
      - main-server
    restart: unless-stopped

  hospital-server-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.hospital_server
    container_name: fedcare-hospital-3
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - HOSPITAL_ID=hospital_3
      - MAIN_SERVER_HOST=main-server
      - MAIN_SERVER_PORT=5000
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./hospital_server:/app/hospital_server
      - ./shared:/app/shared
    networks:
      - fedcare-network
    depends_on:
      - main-server
    restart: unless-stopped

networks:
  fedcare-network:
    driver: bridge
